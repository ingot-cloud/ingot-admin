# Nginx >=1.25; install in conf.d after replacing example origins/paths/certificates.
upstream ingot_gateway { server 127.0.0.1:7980; keepalive 32; }
server {
    listen 443 ssl default_server;
    ssl_reject_handshake on;
}
server {
    listen 443 ssl;
    server_name platform.example.com;
    if ($host != "platform.example.com") { return 444; }
    ssl_certificate /etc/nginx/tls/platform.crt;
    ssl_certificate_key /etc/nginx/tls/platform.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/ingot/admin-platform;
    index index.html;
    include /etc/nginx/same-origin/application.locations.conf;
}
server {
    listen 443 ssl;
    server_name admin.example.com;
    if ($host != "admin.example.com") { return 444; }
    ssl_certificate /etc/nginx/tls/admin.crt;
    ssl_certificate_key /etc/nginx/tls/admin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/ingot/admin;
    index index.html;
    include /etc/nginx/same-origin/application.locations.conf;
}
