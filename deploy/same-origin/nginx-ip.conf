# Nginx >=1.25; install in conf.d after replacing example origins/paths/certificates.
upstream ingot_gateway { server 127.0.0.1:7980; keepalive 32; }
server {
    listen 8443 ssl;
    server_name 192.168.1.100;
    if ($host != "192.168.1.100") { return 444; }
    ssl_certificate /etc/nginx/tls/ip.crt;
    ssl_certificate_key /etc/nginx/tls/ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/ingot/admin-platform;
    index index.html;
    include /etc/nginx/same-origin/application.locations.conf;
}
server {
    listen 9443 ssl;
    server_name 192.168.1.100;
    if ($host != "192.168.1.100") { return 444; }
    ssl_certificate /etc/nginx/tls/ip.crt;
    ssl_certificate_key /etc/nginx/tls/ip.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/ingot/admin;
    index index.html;
    include /etc/nginx/same-origin/application.locations.conf;
}
