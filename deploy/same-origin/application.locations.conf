# Include inside each application server; root is set on that server.
include /etc/nginx/same-origin/application.security.conf;
# Replace https: in connect/img with the actual OSS allowlist when provisioning.
location = /api { return 404; }
location ^~ /api/ {
    proxy_pass http://ingot_gateway/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host "";
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_hide_header Cache-Control;
    # Replace https: in connect/img with the actual OSS allowlist when provisioning.
    include /etc/nginx/same-origin/application.security.conf;
    add_header Cache-Control "no-store" always;
}
location = /index.html {
    # Replace https: in connect/img with the actual OSS allowlist when provisioning.
    include /etc/nginx/same-origin/application.security.conf;
    add_header Cache-Control "no-store" always;
    try_files $uri =404;
}
location /static/ {
    expires 1y;
    try_files $uri =404;
}
location ~* \.map$ { return 404; }
location / { try_files $uri $uri/ /index.html; }
