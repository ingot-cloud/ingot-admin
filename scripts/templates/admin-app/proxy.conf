# 仅供受控 TLS 边缘后方的应用容器使用；3000 端口不得对用户网络开放。
# 边缘覆盖客户端转发头，容器保留外部 HTTPS scheme；本地直连回退当前 scheme。
map $http_x_forwarded_proto $ingot_external_scheme {
    default $scheme;
    https https;
    http http;
}

upstream ingot_gateway {
    server ingot-gateway:7980;
    keepalive 32;
}

server {
    listen       3000;
    server_name  localhost;
    client_max_body_size 1024m;
    server_tokens off;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://ingot_gateway/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ingot_external_scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location ~* \.js\.map$ {
        return 404;
    }

    location ~* \.css\.map$ {
        return 404;
    }
}
